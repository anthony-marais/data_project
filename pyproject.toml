[project]
name = "presslake"
version = "0.1.0"
description = "Datalake presse (RSS) puis RAG sourcé"
readme = "README.md"
authors = [
    { name = "anthony-marais", email = "67336192+anthony-marais@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.83",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "kafka-python>=3.0.11",
    "langdetect>=1.0.9",
    "langfuse>=4.15.1",
    "opensearch-py>=3.2.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-snappy>=0.7.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
presslake = "presslake:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
