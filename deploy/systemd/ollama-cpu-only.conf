# Force Ollama CPU uniquement (stable sur iGPU AMD — évite crash / écran noir).
# Installer : sudo ./scripts/setup-ollama-cpu-only.sh

[Service]
Environment="OLLAMA_LLM_LIBRARY=cpu"
Environment="OLLAMA_NUM_GPU=0"
Environment="OLLAMA_VULKAN=false"
Environment="OLLAMA_IGPU_ENABLE=0"
Environment="HIP_VISIBLE_DEVICES="
Environment="ROCR_VISIBLE_DEVICES="
Environment="HSA_OVERRIDE_GFX_VERSION="
Environment="OLLAMA_KEEP_ALIVE=30m"
