name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: presslake
          POSTGRES_PASSWORD: presslake
          POSTGRES_DB: presslake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U presslake -d presslake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://presslake:presslake@localhost:5432/presslake

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer le package (lock figé)
        run: uv sync --frozen

      - name: Smoke import + CLI
        run: |
          uv run python -c "import presslake; print(presslake.__file__)"
          uv run presslake poll --help
          uv run presslake eval --help
          uv run presslake guide
          uv run presslake pipeline --help
          uv run presslake mcp --help
          uv run presslake spark --help
          uv run presslake spark --dry-run
          uv run presslake recall --help
          uv run presslake recall --rollback

      - name: Contrats JSON Schema (exemples)
        run: uv run presslake validate examples

      - name: Schéma catalogue (Postgres CI)
        run: uv run presslake db init

      - name: API catalogue (TestClient)
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from presslake.api.app import create_app
          c = TestClient(create_app())
          assert c.get('/health').status_code == 200
          assert c.get('/metrics').status_code == 200
          assert c.get('/ops/status').status_code == 200
          print('api ok')
          "

      - name: Eval set + scores mécaniques (sans OpenSearch)
        run: |
          uv run python -c "
          from presslake.eval.dataset import load_eval_set
          from presslake.eval.score import score_case
          from presslake.eval.tracing import tracing_enabled
          from presslake.rag.chat import ChatAnswer
          from presslake.rag.prompt import REFUSAL_MESSAGE

          s = load_eval_set()
          assert s.name == 'rag-v1'
          refuse = next(c for c in s.cases if c.expect == 'refuse')
          empty = ChatAnswer(question=refuse.question, answer=REFUSAL_MESSAGE, passages=[], refused=True)
          sc = score_case(refuse, empty, skip_llm=True)
          assert sc.ok, sc.reason
          assert tracing_enabled() is False
          print('eval ok', len(s.cases), 'cases')
          "

      - name: MCP tools search + read (sans OpenSearch)
        run: |
          uv run python -c "
          import asyncio
          import json
          from presslake.mcp.server import create_server
          from presslake.mcp.tools import read_silver

          names = sorted(t.name for t in asyncio.run(create_server().list_tools()))
          assert names == ['read', 'search'], names
          denied = json.loads(read_silver(silver_s3_uri='s3://presslake/bronze/x.json'))
          assert 'error' in denied
          print('mcp ok', names)
          "

      - name: Recall@k (formule, sans Qdrant)
        run: |
          uv run python -c "
          from presslake.mlops.recall import recall_at_k_from_flags
          from presslake.mlops.params import load_embed_params
          from presslake.vector.config import embedding_model
          assert recall_at_k_from_flags([True, False], k=4) == 0.5
          assert 'paraphrase-multilingual' in embedding_model()
          assert load_embed_params()['vector_size'] == 384
          print('recall formula ok')
          "

      - name: Profil Compose spark (job, pas up quotidien)
        env:
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: cipassword8
          POSTGRES_USER: presslake
          POSTGRES_PASSWORD: presslake
          POSTGRES_DB: presslake
        run: docker compose --profile spark config --quiet

  spark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Tests Spark local (fichier, pas MinIO)
        run: sbt --batch test

