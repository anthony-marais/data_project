name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer le package (lock figé)
        run: uv sync --frozen

      - name: Smoke import + CLI
        run: |
          uv run python -c "import presslake; print(presslake.__file__)"
          uv run presslake poll --help

      - name: Contrats JSON Schema (exemples)
        run: uv run presslake validate examples

      - name: API catalogue (TestClient)
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from presslake.api.app import create_app
          c = TestClient(create_app())
          assert c.get('/health').status_code == 200
          assert c.get('/metrics').status_code == 200
          assert c.get('/ops/status').status_code == 200
          print('api ok')
          "